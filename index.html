<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript</title>
</head>
<body>

    <h1>Latihan JavaScript</h1>

    <h2>Latihan Percabangan</h2>
    <pre id="percabangan"></pre>

    <h2>Latihan Perulangan</h2>
    <pre id="perulangan"></pre>

    <h2>Latihan Function & Logika</h2>
    <pre id="function"></pre>

    <h2>Latihan Pola</h2>
    <pre id="pola"></pre>

    <script>
        // Menampilkan hasil ke halaman
        const hasil = {
            percabangan: "",
            perulangan: "",
            function: "",
            pola: ""
        };

        function tampil(kategori, teks) {
            hasil[kategori] += teks + "\n";
            document.getElementById(kategori).textContent =
                hasil[kategori];
        }

        // PERCABANGAN 1
        let nilai = 80;
        tampil("percabangan",
            nilai >= 75 ? "Lulus" : "Remedial");

        // PERCABANGAN 2
        let role = "A";
        switch (role) {
            case "A":
                tampil("percabangan", "Admin");
                break;
            case "U":
                tampil("percabangan", "User");
                break;
            default:
                tampil("percabangan", "Guest");
        }

        // PERULANGAN 1
        for (let i = 1; i <= 5; i++) {
            tampil("perulangan", i);
        }

        // PERULANGAN 2
        for (let i = 3; i >= 1; i--) {
            tampil("perulangan", i);
        }
        tampil("perulangan", "Start!");

        // FUNCTION 1: FIZZBUZZ
        function fizzBuzz(angka) {
            if (angka % 15 === 0) return "FizzBuzz";
            if (angka % 3 === 0) return "Fizz";
            if (angka % 5 === 0) return "Buzz";
            return angka;
        }
        tampil("function", fizzBuzz(15));

        // FUNCTION 2: GENAP GANJIL
        function cekAngka(angka) {
            return angka % 2 === 0 ? "Genap" : "Ganjil";
        }
        tampil("function", cekAngka(8));

        // FUNCTION 3: BALIK STRING
        function balikString(teks) {
            return teks.split("").reverse().join("");
        }
        tampil("function", balikString("Halo"));

        // POLA 1: SEGITIGA
        for (let i = 1; i <= 4; i++) {
            tampil("pola", "*".repeat(i));
        }

        // POLA 2: PERSEGI PANJANG
        for (let i = 1; i <= 4; i++) {
            tampil("pola", "*".repeat(8));
        }

        // POLA 3: PERSEGI PANJANG KOSONG
        for (let i = 1; i <= 5; i++) {
            let baris = "";
            for (let j = 1; j <= 8; j++) {
                baris += (i === 1 || i === 5 ||
                    j === 1 || j === 8) ? "*" : " ";
            }
            tampil("pola", baris);
        }

        // POLA 4: SEGITIGA SAMA SISI
        for (let i = 1; i <= 4; i++) {
            tampil("pola",
                " ".repeat(4-i) + String(i).repeat(i));
        }

        // POLA 5: SEGITIGA ANGKA
        let angka = 1;
        for (let i = 1; i <= 4; i++) {
            let baris = " ".repeat(4-i);
            for (let j = 1; j <= i; j++) {
                baris += angka++;
            }
            tampil("pola", baris);
        }

        // POLA 6: BELAH KETUPAT
        for (let i = 1; i <= 4; i++) {
            tampil("pola",
                " ".repeat(4-i) + "*".repeat(2*i-1));
        }
        for (let i = 3; i >= 1; i--) {
            tampil("pola",
                " ".repeat(4-i) + "*".repeat(2*i-1));
        }

        // POLA 7: JAM PASIR
        for (let i = 4; i >= 1; i--) {
            tampil("pola",
                " ".repeat(4-i) + "*".repeat(2*i-1));
        }
        for (let i = 2; i <= 4; i++) {
            tampil("pola",
                " ".repeat(4-i) + "*".repeat(2*i-1));
        }

        // POLA 8: SEGITIGA KOSONG
        for (let i = 1; i <= 5; i++) {
            let baris = " ".repeat(5-i);
            for (let j = 1; j <= 2*i-1; j++) {
                baris += (i === 5 || j === 1 ||
                    j === 2*i-1) ? "*" : " ";
            }
            tampil("pola", baris);
        }
    </script>

</body>
</html>
